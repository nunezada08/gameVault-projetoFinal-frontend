<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suporte - Game Vault</title>
    <link rel="stylesheet" href="../assets/styles/suporte-page.css">
    <link rel="icon" type="image/png" href="../assets/images/logo.png">
</head>
<body>
    <header>
        <div id="logoNome">
            <a href="../index.html" aria-label="Início"><img src="../assets/images/logo.png" alt="Logo" width="90px"></a>
            <h1><a href="../index.html" aria-label="Início">GAME VAULT</a></h1>
        </div>

        <nav id="sunoco">
            <a class="sunocoText" href="suporte.html">Suporte</a>
            <a class="sunocoText" href="novidades-page.html">Novidades</a>
            <a class="sunocoText" href="todos-os-jogos-page.html">Consoles</a>
            <a class="sunocoText" href="todos-os-jogos-page.html">Todos os jogos</a>
        </nav>

        <!-- campo de busca (lado direito, ao lado do perfil) -->
        <div id="input">
            <input type="text" placeholder="Pesquisa">
            <img src="../assets/images/lupa.png" alt="Lupa" width="20px">
        </div>

        <div id="perfilMenu">
            <a href="login.html" aria-label="Entrar"><img src="../assets/images/perfilFoto.png" alt="Perfil" width="35px"></a>
            <a href="#" aria-label="Menu"><img src="../assets/images/menu.png" alt="Menu" width="25px"></a>
        </div>
    </header>

    <main>
        <div class="container">
            <section class="help-title">
                <h1>Como podemos ajudar?</h1>
            </section>

            <section class="self-service">
                <div class="service-inner">
                    <h2>Autoatendimento</h2>
                    <div class="service-grid">
                        <button class="service-btn purple">Esqueci a senha do e-mail</button>
                        <button class="service-btn brown">Não encontrei um jogo</button>
                        <button class="service-btn teal">Controle Parental</button>
                        <button class="service-btn green">Sem Acesso a uma Página</button>
                    </div>
                </div>
            </section>

            <section class="contact">
                <h2>Entre em Contato</h2>
                <div class="contact-icons">
                    <a href="#" aria-label="Gmail"><img src="../assets/images/Gmail.png" alt="Gmail"></a>
                    <a href="#" aria-label="WhatsApp" class="whatsapp-link">
                       
                    <a href="#" aria-label="Instagram"><img src="../assets/images/instagram.jpg" alt="Instagram"></a>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <div id="secoes">
            <h5>Inicio</h5>
            <img src="../assets/images/barrinha.png" alt="" width="7px">
            <h5>Catalogo</h5>
            <img src="../assets/images/barrinha.png" alt="" width="7px">
            <h5>Sobre</h5>
            <img src="../assets/images/barrinha.png" alt="" width="7px">
            <h5>Contato</h5>
        </div>

        <div id="senai">
            <img src="../assets/images/brasil.png" alt="Brasil">
            <img src="../assets/images/senai.png" alt="SENAI">
            <img src="../assets/images/sesi.png" alt="SESI">
        </div>

        <div id="textosFinais">
            <p>GameVault – Seu Catálogo de Jogos e Consoles Favoritos</p>
            <p>© 2025 Zytrix. Todos os direitos reservados.</p>
        </div>
    </footer>
</body>
</html>
