<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Vault</title>
    <link rel="stylesheet" href="./assets/styles/index.css">
    <link rel="icon" type="image/png" href="./assets/images/logo.png">
</head>
<body>
    <header>

        <div id="logoNome">
            <img src="./assets/images/logo.png" alt="Logo" width="90px">
            <h1>GAME VAULT</h1>
        </div>

        <div id="sunoco">
            <p class="sunocoText">Suporte</p>
            <p class="sunocoText">Novidades</p>
            <p class="sunocoText">Consoles</p>
            <p class="sunocoText">Todos os jogos</p>
        </div>

        <div id="input">
            <input type="text" placeholder="Pesquisa">
            <img src="./assets/images/lupa.png" alt="Lupa" width="30px">
        </div>

        <div id="perfilMenu">
            <img src="./assets/images/perfilFoto.png" alt="Perfil" width="35px">
            <img src="./assets/images/menu.png" alt="Menu" width="25px">
        </div>

    </header>

    <main>
        <div id="jogosEmAlta">
            <h1>Jogos em alta</h1>
        </div>
        <div id="banner">
            <button id="btnTras"><img src="./assets/images/setaTras.png" alt="seta" width="60px"></button>
            <img id="imagem" src="./assets/images/cod.jpg" alt="silksong">
            <button id="btnFrente"><img src="./assets/images/setaFrente.png" alt="seta" width="60px"></button>
        </div>


        <div id="melhorAvaliados">
            <h1>Melhor avaliados</h1>
        </div>
            <div id="melhorAvaliadosJogos">
                <button id="btnTras2"><img src="./assets/images/setaTras.png" alt="seta" width="40px"></button>

            <div class="carousel-viewport">
                <div class="carousel-track">
                    <img class="slide" src="./assets/images/ghost.png" alt="Elden ring">
                    <img class="slide" src="./assets/images/tlou.png" alt="RDR">
                    <img class="slide" src="./assets/images/godOfWar.png" alt="God of war">
                    
                </div>
            </div>
            <button id="btnFrente2"><img src="./assets/images/setaFrente.png" alt="seta" width="40px"></button>
        </div>


        <div id="exploreCategoria">
            <h1>Explore por categorias</h1>
        </div>
            <div id="categoriasExploraveis">
                <button id="btnTras3"><img src="./assets/images/setaTras.png" alt="seta" width="40px"></button>

            <div class="carousel-viewport2">
                <div class="carousel-track2">
                    <img class="slideGenero" src="./assets/images/acao.png" alt="Ação ">
                    <img class="slideGenero" src="./assets/images/soulslike.png" alt="Soulslike">
                    <img class="slideGenero" src="./assets/images/terror.png" alt="Terror">
                    <img class="slideGenero" src="./assets/images/fps.png" alt="FPS">
                    <img class="slideGenero" src="./assets/images/rpg.png" alt="rpg">
                    
                </div>
            </div>
            <button id="btnFrente3"><img src="./assets/images/setaFrente.png" alt="seta" width="40px"></button>
        </div>

        <div id="divFiltroJogos">
            <section class="filtrosJogos">
                <h1>Lançamentos</h1>
            </section>

            <section class="filtrosJogos">
                <h1>Recomendados</h1>
            </section>

            <section class="filtrosJogos">
                <h1>Mais Populares</h1>
            </section>

            <section class="filtrosJogos">
                <h1>Todos os jogos</h1>
            </section>

            <section class="filtrosJogos">
                <h1>Marcadores</h1>
            </section>
        </div>

    </main>

    <script src="./assets/scripts/index.js"></script>
    
</body>
</html>
