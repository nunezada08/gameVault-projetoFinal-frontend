<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>recomendados</title>
    <link rel="stylesheet" href="../assets/styles/recomendados-page.css" />
    <link rel="icon" type="image/png" href="../assets/images/logo.png" />
  </head>
  <body>
    <header>
      <div id="logoNome">
        <img src="../assets/images/logo.png" alt="Logo" width="90px" />
        <h1>GAME VAULT</h1>
      </div>

      <div id="sunoco">
        <p class="sunocoText">Suporte</p>
        <p class="sunocoText">Novidades</p>
        <p class="sunocoText">Consoles</p>
      </div>

      <div id="input">
        <input type="text" placeholder="Pesquisa" />
        <img src="../assets/images/lupa.png" alt="Lupa" width="30px" />
      </div>

      <div id="perfilMenu">
        <img src="../assets/images/perfilFoto.png" alt="Perfil" width="35px" />
        <img src="../assets/images/menu.png" alt="Menu" width="25px" />
      </div>
    </header>
    <section>
      <div id="jogosEmAlta">
        <h1>recomendados</h1>
      </div>
      <div class="jogos">
        <img
          id="ghost-of-tsushima-mini"
          src="../assets/images/ghost-of-tsushima-mini.png"
        />
        <img
          id="horizon-forbidden-west-mini"
          src="../assets/images/horizon-forbidden-west-mini.png"
        />
      </div>
       <div class="jogos-2">
        <img
          id="until-dawn-2-mini"
          src="../assets/images/until-dawn-2-mini.png"
        />
        <img
          id="days-gone-mini"
          src="../assets/images/days-gone-mini.png"
        />
      </div>
       <div class="jogos-3">
        <img
          id="spider-man-2-mini"
          src="../assets/images/spider-man-2-mini.png"
        />
        <img
          id="detroit-become-human-mini"
          src="../assets/images/detroit-become-human-mini.png"
        />
      </div>
       <div class="jogos-4">
        <img
          id="demon-souls-mini"
          src="../assets/images/demon-souls-mini.png"
        />
        <img
          id="stellar-blade-mini"
            src="../assets/images/stellar-blade-mini.png"
            alt="Stellar Blade"
        />
      </div>
    </section>
  </body>
</html>
