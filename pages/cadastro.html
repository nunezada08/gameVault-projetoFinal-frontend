<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - GAME VAULT</title>
    <link rel="stylesheet" href="../assets/styles/cadastro.css"> 
</head>
<body>
    <main>
        <section id="quadrado">
            <div id="logo">
            <img src="../assets/images/logo.png" alt="Logo GameVault">
            <h3>GameVault</h3>
            <p>Cadastro</p>
        </div>
        <div id="infos">
            <input id="infoNome" type="text" placeholder="Nome de Usuário" maxlength="50">
            <input id="infoData" type="date" placeholder="Data de Nascimento">
            <input id="infoMail" type="text" placeholder="Email" maxlength="264">
            <input id="infoSenha" type="text" placeholder="Senha" maxlength="20">
        </div>

        <div id="btns">
            <p>Avançar</p>
        </div>
        </section>
    </main>

    <script src="../assets/scripts/cadastroScript.js"></script>

</body>

         
</html>
