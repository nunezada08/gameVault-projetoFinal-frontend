<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Vault</title>
    <link rel="stylesheet" href="../assets/styles/todos-os-jogos-page.css">
    <link rel="stylesheet" href="../assets/styles/detalhes.css">
</head>
<body>
    <header>

        <div id="logoNome">
            <img src="../assets/images/logo.png" alt="Logo" width="90px">
            <h1>GAME VAULT</h1>
        </div>

        <div id="sunoco">
            <p class="sunocoText">Suporte</p>
            <p class="sunocoText">Novidades</p>
            <p class="sunocoText">Consoles</p>
            <p class="sunocoText">Todos os jogos</p>
        </div>

        <div id="input">
            <input type="text" placeholder="Pesquisa">
                <img src="../assets/images/lupa_nova.png" alt="Lupa">
        </div>

        <div id="perfilMenu">
            <img src="../assets/images/perfilFoto.png" alt="Perfil" width="35px">
            <img src="../assets/images/menu.png" alt="Menu" width="25px">
        </div>

    </header>

    <main id="mainPrincipal">
        <section id="todosOsJogos">
            <h1 class="todos-jogos">TODOS OS JOGOS</h1>
        </section>

        <div class="games-list"></div>

    </main>

    <script src="../assets/scripts/todos-os-jogos-script.js"></script>
    
</body>
</html>
