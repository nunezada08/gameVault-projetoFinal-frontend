<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="stylesheet" href="../assets/styles/perfil.css">
</head>
<body>
    <header>
        <div id="logoNome">
        <img src="../assets/images/logo.png" alt="Logo" width="90px">
        <h1>GAME VAULT</h1>
        </div>

        <div id="sunoco">
            <p class="sunocoText">Suporte</p>
            <p class="sunocoText">Novidades</p>
            <p class="sunocoText">Consoles</p>

        </div>

        <div id="input">
            <input type="text" placeholder="Pesquisa">
            <img src="../assets/images/lupa.png" alt="Lupa" width="30px">
        </div>

        <div id="perfilMenu">
            <img src="../assets/images/perfilFoto.png" alt="Perfil" width="35px">
            <img src="../assets/images/menu.png" alt="Menu" width="25px">
        </div>
    </header>
<main></main>
    <section id="container-perfil">
        <div id="foto-perfil">
            <img id="imagem" src="../assets/images/perfilFoto.png" alt="">

        </div>
        <div id="descricao-perfil">

            <div id="nome">
                <h2>Nome:      User</h2>
            </div>

            <div id="detalhes">
                <div class="detal">
                    <h3>Data de Nascimento: xx/xx/xxxx</h3>
                </div>
                <div class="detal">
                    <h3>Email: email.user@email.com</h3>
                </div>
                <div class="detal">
                    <h3>Senha: xxxxxxxxxxxx</h3>
                </div>
            </div>
        </div>
    </section>

    <section id="biblioteca">

    </section>
</main>

</html>
