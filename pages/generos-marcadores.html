<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>generos</title>
    <link rel="stylesheet" href="../assets/styles/generos-marcadores.css" />
  </head>
  <body>
    <header>
      <div id="logoNome">
        <img src="../assets/images/logo.png" alt="Logo" width="90px" />
        <h1>GAME VAULT</h1>
      </div>

      <div id="sunoco">
        <a href="./suporte-page.html">
          <p class="sunocoText">Suporte</p>
        </a>
        <a href="./novidades-page.html">
          <p class="sunocoText">Novidades</p>
        </a>
        <p class="sunocoText">Consoles</p>
      </div>

      <div id="input">
        <input type="text" placeholder="Pesquisa" />
        <img src="../assets/images/lupa.png" alt="Lupa" width="30px" />
      </div>

      <div id="perfilMenu">
        <img src="../assets/images/perfilFoto.png" alt="Perfil" width="35px" />
        <img src="../assets/images/menu.png" alt="Menu" width="25px" />
      </div>
    </header>
    <div id="generos">
      <h1>Ação</h1>
    </div>
    <section>
      <div id="marcadores">
        <button id="btnTras2">
          <img src="../assets/images/setaTras.png" alt="seta" width="40px" />
        </button>

        <div class="carousel-viewport">
          <div class="carousel-track">
            <figure class="slide-card">
              <img
                class="slide"
                src="../assets/images/ghost.png"
                alt="Ghost of Tsushima"
              />
            </figure>
            <figure class="slide-card">
              <img
                class="slide"
                src="../assets/images/tlou.png"
                alt="The Last of Us"
              />
            </figure>
            <figure class="slide-card">
              <img
                class="slide"
                src="../assets/images/godOfWar.png"
                alt="God of War"
              />
            </figure>
          </div>
        </div>
        <button id="btnFrente2">
          <img src="../assets/images/setaFrente.png" alt="seta" width="40px" />
        </button>
      </div>
      
    </section>
    <script src="../assets/scripts/generos-script.js"></script>
  </body>
</html>
