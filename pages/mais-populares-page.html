<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mais populares</title>
    <link rel="stylesheet" href="../assets/styles/mais-populares-page.css" />
    <link rel="icon" type="image/png" href="../assets/images/logo.png" />
  </head>
  <body>
    <header>
      <div id="logoNome">
        <img src="../assets/images/logo.png" alt="Logo" width="90px" />
        <h1>GAME VAULT</h1>
      </div>

      <div id="sunoco">
        <a href="./suporte-page.html">

          <p class="sunocoText">Suporte</p>
        </a>
        <a href="./novidades-page.html">

          <p class="sunocoText">Novidades</p>
        </a>
        <p class="sunocoText">Consoles</p>
      </div>

      <div id="input">
        <input type="text" placeholder="Pesquisa" />
        <img src="../assets/images/lupa.png" alt="Lupa" width="30px" />
      </div>

      <div id="perfilMenu">
        <img src="../assets/images/perfilFoto.png" alt="Perfil" width="35px" />
        <img src="../assets/images/menu.png" alt="Menu" width="25px" />
      </div>
    </header>

    <section>
      <div id="jogosEmAlta">
        <h1>Jogos em alta</h1>
      </div>
      <div id="imagem">
        <img id="battlefield" src="../assets/images/battlefield.jpg" />
      </div>

      <div class="imagens">
        <img id="eldenRing" src="../assets/images/eldenRing.png" alt="" />
        <img
          id="death-stranding-2-mini"
          src="../assets/images/death-stranding-2-mini.png"
          alt=""
        />
      </div>

      <div class="mini">
        <img
          id="silksong-mini"
          src="../assets/images/silksong-mini.png"
          alt=""
        />
        <img
          id="astro-bot-mini"
          src="../assets/images/astro-bot-mini.png"
          alt=""
        />
        <img
          id="doom"
          src="../assets/images/doom-the-dark-ages-mini.png"
          alt=""
        />
      </div>
    </section>
    <footer>
      <div id="secoes">
        <h5>Inicio</h5>
        <img src="./assets/images/barrinha.png" alt="" width="7px" />
        <h5>Catalogo</h5>
        <img src="./assets/images/barrinha.png" alt="" width="7px" />
        <h5>Sobre</h5>
        <img src="./assets/images/barrinha.png" alt="" width="7px" />
        <h5>Contato</h5>
      </div>

      <div id="senai">
        <img src="../assets/images/brasil.png" alt="" />
        <img src="../assets/images/senai.png" alt="" />
        <img src="../assets/images/sesi.png" alt="" />
      </div>

      <div id="textosFinais">
        <p>GameVault – Seu Catálogo de Jogos e Consoles Favoritos</p>
        <p>© 2025 Zytrix. Todos os direitos reservados.</p>
      </div>
    </footer>
  </body>
</html>
